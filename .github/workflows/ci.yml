name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # The latest Node only: pnpm 11 needs Node 22.13 or later.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  # The same oracle under React 19 (the lockfile pins React 18).
  react-19:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -D react@^19 react-dom@^19
      - run: node -e "console.log('React', require('react').version)"
      - run: pnpm test:oracles

  # Mutates the owned code and reports each change that no law catches.
  gap-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:gaps
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-gaps
          path: .oracle-gaps/out
